name: los-java
on:
  pull_request:
  push:
    branches: [main, legacy-los]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build and run the unit tests
        working-directory: los-java
        run: ./mvnw -B verify
      - name: Compare with legacy golden datasets and control totals
        working-directory: los-java
        run: make parity
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: los-java-parity
          path: los-java/out/java/
