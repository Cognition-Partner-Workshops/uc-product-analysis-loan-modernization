name: los-java
on:
  pull_request:
  push:
    branches: [main, legacy-los]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build and run the unit tests
        working-directory: los-java
        run: ./mvnw -B verify
